name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    # Windows runner 默认代码页会让中文断言/日志 mojibake；显式 UTF-8 与本地一致
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          # 与 frontend/.nvmrc、package.json engines 同源（安全下限 24.22.1）
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 后端测试
        timeout-minutes: 45
        run: |
          cd backend
          python -m venv venv
          venv/Scripts/python.exe -m pip install -r requirements.txt
          venv/Scripts/python.exe -m pytest tests -q -n 12 --durations=15
      - name: 前端测试与构建
        run: |
          cd frontend
          npm ci
          npx vitest run
          npm run build
