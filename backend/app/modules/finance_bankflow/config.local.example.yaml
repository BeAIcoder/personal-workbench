# 银行流水 → BIP 导入模板：账号映射示例（无任何真实值）
#
# 用法：复制本文件为同目录的 config.local.yaml，把示例账号与账套编码替换为
# 本机真实值（config.local.yaml 已在 .gitignore 中，不会入库/进分发包）。
#
# - key：银行账号全号，或 ≥4 位的账号尾号（尾号匹配取最长后缀；全号精确优先）
# - ent：BIP 账套/核算组织编码，必须以 H 开头
# - name：项目/账簿展示名（仅用于预览，可留空）
bank_accounts:
  "0000000000000000": { ent: "H000000", name: "示例项目甲" }
  "0000": { ent: "H000000", name: "示例项目甲（尾号）" }
