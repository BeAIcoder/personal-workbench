[pytest]
# 测试分层/分片契约（2026-11-17 复盘 #7）：markers 只在此登记，命令侧按需过滤。
# - 全量：pytest tests
# - PR 快跑：pytest tests -m "not slow"
# 不要为了快跑给大量用例加 marker：先量后标，只标注真正慢的整文件/单例。
# 整文件慢用 `pytestmark = pytest.mark.slow`，这样 dev/shard_tests.py --mode fast
# 能连文件一起跳过（CI 的 workflow_dispatch suite=fast 就是这条路）。
testpaths = tests

# 单例超时兜底（pytest-timeout，requirements 与 lock 同步声明）。
# CI 用 --timeout=120 显式覆盖；本地漏写参数时也不至于无限挂起。
timeout = 120

markers =
    slow: 慢用例（单例 >10s、起子进程/外部引擎、全流程应用启动）；默认参与全量，PR 快跑用 -m "not slow"
    fast: 轻量用例（默认不标注，需要时用 -m fast 手动挑选）
